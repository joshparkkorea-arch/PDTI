name: update-ticker

# 장중 시세를 받아 ticker.json을 자동 갱신한다.
# (배너는 ticker.json을 60초마다 읽어 화면을 다시 그림 → index 재빌드 불필요)
on:
  schedule:
    # GitHub cron은 UTC 기준. 표시는 대략값이며 5~15분 지연될 수 있음.
    - cron: "*/15 0-7 * * 1-5"    # 한국 장중  09:00~16:xx KST (00:00~07:00 UTC)
    - cron: "*/15 13-20 * * 1-5"  # 미국 장중  09:30~16:00 ET  (13:30~20:00 UTC)
  workflow_dispatch:               # 수동 실행 버튼

permissions:
  contents: write                  # ticker.json 커밋용

concurrency:
  group: update-ticker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 푸시 충돌 시 reset --hard origin/main 재시도용(전체 히스토리)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KIS 토큰 공용 캐시 복원(읽기 전용). 발급은 daily-news(9:05)만 하므로 여기선 저장 안 함.
      - name: Restore KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: kis-token-
          restore-keys: kis-token-

      - name: Update ticker.json
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python tools/update_ticker.py

      # push가 거절되면 rebase 대신 '원격 리셋 + 스냅샷 재적용'으로 수렴시킨다.
      # ticker.json은 매 실행마다 통째로 다시 쓰는 스냅샷이라 3-way 병합 대상이 아니다.
      # 사고#36(2026-09-30): rebase가 ticker.json에서 충돌 → abort로 원상복귀 →
      #   다음 시도가 똑같은 충돌을 다시 만남 → 재시도 5회가 전부 무의미. 런 전체 실패.
      # 원격이 우리보다 최신 시각(asof)이면 덮어쓰지 않고 그냥 물러난다(배너 역주행 방지).
      - name: Commit if changed (충돌 시 원격 리셋 후 재적용)
        run: |
          if git diff --quiet -- ticker.json; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          NEW="${RUNNER_TEMP:-/tmp}/ticker.new.json"
          cp ticker.json "$NEW"
          MINE=$(sed -n 's/.*"asof": "\([0-9-]\{10\} [0-9:]\{5\}\).*/\1/p' "$NEW" | head -1)
          git config user.name  "invest-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ticker.json
          git commit -m "chore(ticker): 시세 자동 갱신 [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ 푸시 성공 (시도 $i)"; exit 0
            fi
            echo "⚠️ 푸시 거절(원격이 앞서감) — 원격 리셋 후 스냅샷 재적용 ($i/5)"
            git fetch origin main
            git reset --hard origin/main          # 우리 커밋 폐기 → 원격과 동일한 상태
            REMOTE=$(sed -n 's/.*"asof": "\([0-9-]\{10\} [0-9:]\{5\}\).*/\1/p' ticker.json | head -1)
            if [ -n "$REMOTE" ] && [ -n "$MINE" ] && [[ "$REMOTE" > "$MINE" ]]; then
              echo "원격 ticker.json($REMOTE)이 우리 것($MINE)보다 최신 — 덮어쓰지 않고 종료"
              exit 0
            fi
            cp "$NEW" ticker.json
            if git diff --quiet -- ticker.json; then
              echo "원격과 내용 동일 — 종료"; exit 0
            fi
            git add ticker.json
            git commit -m "chore(ticker): 시세 자동 갱신 [skip ci]"
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시 실패 — 원격 상태 확인 필요"; exit 1
