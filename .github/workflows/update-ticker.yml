name: update-ticker

# 장중 시세를 받아 ticker.json을 자동 갱신한다.
# (배너는 ticker.json을 60초마다 읽어 화면을 다시 그림 → index 재빌드 불필요)
on:
  schedule:
    # GitHub cron은 UTC 기준. 표시는 대략값이며 5~15분 지연될 수 있음.
    - cron: "*/15 0-7 * * 1-5"    # 한국 장중  09:00~16:xx KST (00:00~07:00 UTC)
    - cron: "*/15 13-20 * * 1-5"  # 미국 장중  09:30~16:00 ET  (13:30~20:00 UTC)
  workflow_dispatch:               # 수동 실행 버튼

permissions:
  contents: write                  # ticker.json 커밋용

concurrency:
  group: update-ticker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # rebase 재시도 시 merge-base 확보용(전체 히스토리)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KIS 토큰 공용 캐시 복원(읽기 전용). 발급은 daily-news(9:05)만 하므로 여기선 저장 안 함.
      - name: Restore KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: kis-token-
          restore-keys: kis-token-

      - name: Update ticker.json
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python tools/update_ticker.py

      # push가 거절되면(다른 워크플로가 먼저 push) 원격을 rebase한 뒤 최대 5회 재시도.
      - name: Commit if changed (충돌 시 rebase 재시도)
        run: |
          if git diff --quiet -- ticker.json; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "invest-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ticker.json
          git commit -m "chore(ticker): 시세 자동 갱신 [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ 푸시 성공 (시도 $i)"; exit 0
            fi
            echo "⚠️ 푸시 거절(원격이 앞서감) — fetch+rebase 후 재시도 ($i/5)"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase 충돌 — 중단하고 재시도"; git rebase --abort || true
            fi
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시 실패 — 원격 상태 확인 필요"; exit 1
