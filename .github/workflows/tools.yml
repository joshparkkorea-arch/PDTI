name: tools

# 웹 UI에서 눌러 쓰는 수동 도구 모음. 정기 실행 없음(workflow_dispatch 전용).
#  · check-gold   : 금시세 수집 경로 자가진단(어느 소스가 살아있는지 확인만, 커밋 없음)
#  · rebuild-site : 기사 발행 없이 index.html만 다시 생성해 커밋
#                   (템플릿·지표 카드 변경을 다음 발행까지 기다리지 않고 즉시 반영할 때)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업"
        required: true
        type: choice
        default: check-gold
        options:
          - check-gold
          - rebuild-site

permissions:
  contents: write

concurrency:
  group: tools
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 금시세 경로 자가진단
        if: ${{ github.event.inputs.task == 'check-gold' }}
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python tools/check_gold.py

      - name: index.html 재생성
        if: ${{ github.event.inputs.task == 'rebuild-site' }}
        run: python tools/build_site.py

      # 기사·manifest는 건드리지 않는다. index.html 한 파일만 커밋한다.
      - name: 변경분 커밋·푸시 (충돌 시 rebase 재시도)
        if: ${{ github.event.inputs.task == 'rebuild-site' }}
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html 변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "invest-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "chore(site): index.html 수동 재생성 [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ 푸시 성공 (시도 $i)"; exit 0
            fi
            echo "⚠️ 푸시 거절(원격이 앞서감) — fetch+rebase 후 재시도 ($i/5)"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase 충돌 — 중단하고 재시도"; git rebase --abort || true
            fi
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시 실패 — 원격 상태 확인 필요"; exit 1
