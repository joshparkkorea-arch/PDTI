name: daily-news

# 데일리 뉴스레터 자동 발행: 개장 직후(09:05 KST) · 마감 직후(15:35 KST), 평일만.
# 거래일(휴장일) 판정은 daily_news.py가 KIS 휴장일 API로 직접 수행 → 휴장이면 스스로 건너뜀.
on:
  schedule:
    - cron: "5 0 * * 1-5"    # 09:05 KST = 00:05 UTC → 개장 브리핑
    - cron: "35 6 * * 1-5"   # 15:35 KST = 06:35 UTC → 마감 시황
  workflow_dispatch:
    inputs:
      mode:
        description: "open(개장) 또는 close(마감) — 비우면 시각으로 자동 판단"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # rebase 재시도 시 merge-base 확보용(전체 히스토리)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KIS 토큰 공용 캐시 복원. 이 워크플로(9:05/15:35)가 발급·저장을 담당한다.
      - name: Restore KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: kis-token-
          restore-keys: kis-token-

      - name: 모드 결정 (open/close)
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            H=$(date -u +%H)            # UTC 시각
            if [ "$H" -lt "03" ]; then M="open"; else M="close"; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "선택된 모드: $M"

      - name: 시세 갱신(update_ticker)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python tools/update_ticker.py || echo "update_ticker 경고(계속 진행)"

      - name: 데일리 기사 생성
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python tools/daily_news.py ${{ steps.mode.outputs.mode }}

      # ticker.json은 커밋하지 않는다(15분 티커 워크플로가 단독으로 소유 → 충돌 표면 제거).
      # 기사·매니페스트·홈만 커밋하고, push가 거절되면 원격을 rebase한 뒤 최대 5회 재시도.
      - name: 변경분 커밋·푸시 (충돌 시 rebase 재시도)
        run: |
          # data(김프 히스토리) 포함 필수 — §5.4: 빠지면 매 런마다 히스토리 유실(2026-07-08 복구)
          if git diff --quiet -- newsletters manifest.json index.html data; then
            echo "변경 없음(휴장일 등) — 커밋 생략"; exit 0
          fi
          git config user.name  "invest-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletters manifest.json index.html data
          git commit -m "feat(daily): ${{ steps.mode.outputs.mode }} 뉴스레터 자동 발행 [skip ci]"
          # 커밋 대상 외 작업트리 잔여물(예: 시세 갱신 스텝의 ticker.json) 정리 —
          # 남아 있으면 rebase가 'unstaged changes'로 거절됨(2026-07-08 푸시 5연속 실패 원인)
          git checkout -- . || true
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ 푸시 성공 (시도 $i)"; exit 0
            fi
            echo "⚠️ 푸시 거절(원격이 앞서감) — fetch+rebase 후 재시도 ($i/5)"
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              echo "rebase 충돌 — 중단하고 재시도"; git rebase --abort || true
            fi
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 푸시 실패 — 원격 상태 확인 필요"; exit 1

      # 9:05/15:35 실행에서 발급된 토큰을 캐시에 저장 → 당일 시세 갱신기가 재사용.
      - name: Save KIS token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: kis-token-${{ github.run_id }}-${{ github.run_attempt }}
